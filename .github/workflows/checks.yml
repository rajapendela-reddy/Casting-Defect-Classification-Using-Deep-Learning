name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: python -m pip install -r requirements-cpu.txt -r requirements-dev.txt
      - name: Verify the original run and checkpoint structures
        run: python -m casting_src.verify --check-checkpoints
      - name: Run regression tests
        run: python -m pytest -q
